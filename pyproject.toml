[project]
name = "anthelion-agent"
version = "0.1.0"
description = "Take-home: an agent platform over news headlines + S&P 500 financial data."
requires-python = ">=3.11"
# Agent service runtime deps. psycopg lives in the `ingest` group, not here —
# the service talks to Postgres via asyncpg; only the ingest job needs psycopg.
dependencies = [
    "litellm>=1.60.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.30.0",
    "statsmodels>=0.14.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
]

# pyproject.toml + uv.lock are the single source of truth for every Python
# environment — host-side dev and both container builds. Each container syncs
# a subset of the one lockfile:
#   service  → uv sync --frozen --no-dev          (project deps only)
#   ingest   → uv sync --frozen --only-group ingest  (just psycopg + pandas)
#   host dev → uv sync                            (project deps + dev group)
[dependency-groups]
ingest = [
    "psycopg[binary]>=3.2.0",
    "pandas>=2.2.0",
]
dev = [
    "black>=24.10.0",
    "mypy>=1.13.0",
    "flake8>=7.1.0",  # config lives in .flake8 (portable, no plugin needed)
    "pytest>=8.0.0",
]

# Application, not a package — uv shouldn't try to install us as a wheel.
[tool.uv]
package = false


[tool.pytest.ini_options]
# `pythonpath = ["."]` puts the repo root on sys.path so tests can
# `import service.*` without the project being installed as a package.
pythonpath = ["."]
testpaths = ["tests"]


# ── Code-quality tooling ───────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true   # statsmodels, litellm — third-party stubs are spotty
# Keep this off for now; full annotation discipline is a separate lift.
disallow_untyped_defs = false
exclude = ['\.venv', 'build', 'dist']

# flake8 config intentionally lives in .flake8, not here — flake8 has no native
# pyproject.toml support and the .flake8 file is portable without a plugin.
